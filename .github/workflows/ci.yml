name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test -- --watchAll=false --ci

      - name: Build
        run: npm run build

      - name: Install function dependencies
        working-directory: netlify/functions
        run: npm ci --omit=dev

      - name: Check function syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find netlify/functions -name '*.js' -not -path '*/node_modules/*' -print0)
