[build]
  command = "CI=false npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  CI = "false"
  BROWSER = ""
  PORT = ""
  NPM_FLAGS = "--legacy-peer-deps"

# Proxy API routes to Netlify Functions (CORS handled in function code)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Serve static assets directly (before SPA redirect)
# These files should be served as-is, not redirected to index.html
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200
  force = true

# Handle SPA routing by redirecting all other requests to index.html (exclude /api/* and static files)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.firebaseio.com https://firestore.googleapis.com https://*.googleapis.com https://*.netlify.app https://api.stripe.com http://localhost:8888 http://localhost:3000; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseapp.com https://*.google.com https://apis.google.com https://*.stripe.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://lh3.googleusercontent.com https://*.google.com https://*.gravatar.com https://*.stripe.com; font-src 'self' data:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://*.stripe.com; base-uri 'self'; form-action 'self';"

# Prevent caching of API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# CRA hashed assets — safe to cache long-term (filename changes on each build)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the SPA shell so deploys reach users immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[dev]
  port = 8888
  targetPort = 3000 