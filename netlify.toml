[build]
  command = "npm install --legacy-peer-deps && CI=false npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  CI = "false"
  BROWSER = ""
  PORT = ""
  NPM_FLAGS = "--legacy-peer-deps"
  # Exclude REACT_APP_GROQ_API_KEY from secrets scanning
  # This key is intentionally bundled in the client-side code
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_GROQ_API_KEY"

# Handle API routes FIRST (before SPA redirect)
# Handle OPTIONS preflight requests
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 204
  methods = ["OPTIONS"]
  force = true
  [redirects.headers]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Handle API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
  [redirects.headers]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Serve static assets directly (before SPA redirect)
# These files should be served as-is, not redirected to index.html
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200
  force = true

# Handle SPA routing by redirecting all other requests to index.html (exclude /api/* and static files)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.firebaseio.com https://firestore.googleapis.com https://*.googleapis.com https://api.groq.com https://*.netlify.app/api/* https://api.stripe.com http://localhost:8888 http://localhost:3000; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseapp.com https://*.google.com https://apis.google.com https://*.stripe.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://lh3.googleusercontent.com https://*.google.com https://*.gravatar.com https://*.stripe.com; font-src 'self' data:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://*.stripe.com; base-uri 'self'; form-action 'self';"

[dev]
  port = 8888
  targetPort = 3000 